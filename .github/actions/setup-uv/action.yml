name: Set up uv
description: Install the pinned uv version and a Python interpreter. The single place the CI uv version is pinned.

inputs:
  python-version:
    description: Python version to install.
    default: "3.14"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        # renovate: datasource=github-releases depName=astral-sh/uv
        version: 0.13.5
        python-version: ${{ inputs.python-version }}
        enable-cache: true
