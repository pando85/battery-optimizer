name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste energy data, Home Assistant or Prometheus URLs, or tokens.
        Redact anything that identifies your installation.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command line and a minimal, anonymised input if needed.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, image tag or commit SHA.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: Relevant output, redacted. No tokens.
      render: shell
