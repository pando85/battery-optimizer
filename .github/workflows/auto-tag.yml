name: Auto tag

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      # The PAT (not GITHUB_TOKEN) is required so that pushing the tag triggers the Images workflow.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.PAT }}
          fetch-depth: 0

      - name: Check for a released version in the changelog
        id: guard
        run: |
          if [ -f CHANGELOG.md ] && grep -qE '^## \[v?[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md; then
            echo "has_version=true" >> "$GITHUB_OUTPUT"
          else
            echo "No CHANGELOG.md or no version heading yet; nothing to tag."
            echo "has_version=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get last changelog version
        if: steps.guard.outputs.has_version == 'true'
        id: changelog_reader
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          path: ./CHANGELOG.md

      - name: Check if tag exists
        if: steps.guard.outputs.has_version == 'true'
        env:
          TAG: ${{ steps.changelog_reader.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists"
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "Tag $TAG does not exist"
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Import GPG key
        if: steps.guard.outputs.has_version == 'true' && env.TAG_EXISTS == 'false'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Create new tag
        if: steps.guard.outputs.has_version == 'true' && env.TAG_EXISTS == 'false'
        env:
          TAG: ${{ steps.changelog_reader.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git config --global user.name "$OWNER"
          git config --global user.email "$OWNER@users.noreply.github.com"
          git tag -s "$TAG" -m "$TAG" --local-user "$(gpg --list-keys --with-colons | grep '^pub' | cut -d':' -f5)"
          git push origin "$TAG"
