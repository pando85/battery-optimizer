[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-optimizer"
version = "0.1.0"
description = "Battery optimisation toolkit: Prometheus/Home Assistant extraction, dataset build and battery MPC benchmarks"
requires-python = ">=3.12"
dependencies = [
    "pyarrow",
    "duckdb",
    "scipy",
    "pyyaml",
    "httpx",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
battery-optimizer = "battery_optimizer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
