[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-optimizer"
version = "0.3.0"
description = "Battery optimisation toolkit: Prometheus/Home Assistant extraction, dataset build and battery MPC benchmarks"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE.md"]
requires-python = ">=3.14"
dependencies = [
    "pyarrow",
    "duckdb",
    "scipy",
    "pyyaml",
    "httpx",
    "numpy",
    "holidays",
    "fastapi",
    "uvicorn",
    "prometheus-client",
    "websockets",
]

[project.urls]
Homepage = "https://github.com/pando85/home-energy-optimizer"
Issues = "https://github.com/pando85/home-energy-optimizer/issues"
Changelog = "https://github.com/pando85/home-energy-optimizer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.scripts]
battery-optimizer = "battery_optimizer.cli:main"

[dependency-groups]
# Release/CI tooling, kept out of the runtime image and the test environment.
# Use with: uv run --only-group tools <command>
tools = [
    "git-cliff",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/battery_optimizer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/config", "/README.md", "/LICENSE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
